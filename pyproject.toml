[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxsedfit"
version = "0.1.0"
description = "Single-source GRAHSP-style photometric fitting with JAX + NumPyro"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "jaxsedfit contributors" }
]
dependencies = [
  "numpy>=2,<2.4",
  "scipy",
  "setuptools>=68,<81",
  "astropy",
  "tqdm",
  "extinction",
  "matplotlib",
  "corner",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "jax_cosmo",
  "numpyro==0.19.0",
  "jaxns==2.6.9",
  "tensorflow-probability==0.25.0",
  "optax",
  "dsps",
  "diffstar",
  "dustmaps",
]

[project.scripts]
jaxsedfit = "jaxsedfit.run:main"
jaxsedfit-benchmark = "jaxsedfit.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaxsedfit = ["resources/filters/filter_registry.txt", "resources/filters/**/*.dat", "resources/filters/*.dat", "resources/nebular/*.npz", "resources/templates/*", "resources/templates/dale2014/*", "resources/styles/*.mplstyle"]
